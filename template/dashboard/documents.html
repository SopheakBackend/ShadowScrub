{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Document Scrubber</h2>
<p class="text-muted mb-4">
  Upload a <strong>.pdf</strong> or <strong>.docx</strong> file.
  Processing runs in the background via Celery.
</p>

<div class="row">
  <div class="col-md-6 mb-3">
    <form id="fileUploadForm" enctype="multipart/form-data">
      {% csrf_token %}
      <label class="form-label fw-bold">Select Document</label>
      <input type="file" id="fileInput" name="file" class="form-control" accept=".pdf,.docx" required>
      <button type="submit" class="btn btn-success mt-3 w-100" id="uploadBtn">
        Upload & Scrub Document
      </button>
    </form>
  </div>

  <div class="col-md-6 mb-3">
    <label class="form-label fw-bold">Extracted Output</label>

    <div id="loadingSpinner" class="d-none text-center p-4 bg-white border rounded">
      <div class="spinner-border text-primary mb-2" role="status"></div>
      <p class="mb-0 text-muted" id="statusMessage">Uploading document...</p>
    </div>

    <div id="fileOutput" class="p-3 bg-white border rounded" style="min-height: 200px; white-space: pre-wrap;">
      <span class="text-muted">Clean text will appear here after processing.</span>
    </div>

    <!-- ACTION BUTTONS -->
    <div id="resultActions" class="d-none mt-2 d-flex flex-wrap gap-2">
      <button type="button" class="btn btn-outline-secondary btn-sm" id="copyBtn">Copy text</button>
      <button type="button" class="btn btn-outline-primary btn-sm" id="downloadTxtBtn">Download .txt</button>
      <button type="button" class="btn btn-outline-danger btn-sm d-none" id="downloadPdfBtn">Download .pdf</button>
      <button type="button" class="btn btn-outline-info btn-sm d-none" id="downloadDocxBtn">Download .docx</button>
    </div>

    <div id="fileSummary" class="mt-3"></div>
  </div>
</div>

<script>
function getCookie(name) {
  const value = `; ${document.cookie}`;
  const parts = value.split(`; ${name}=`);
  if (parts.length === 2) return parts.pop().split(';').shift();
  return null;
}

let latestCleanText = '';
let sourceFormat = '';

function resetUI() {
  document.getElementById('uploadBtn').disabled = false;
  document.getElementById('loadingSpinner').classList.add('d-none');
}

function showResultActions(text, filename) {
  latestCleanText = text || '';
  sourceFormat = '';

  const name = (filename || '').toLowerCase();
  if (name.endsWith('.pdf')) sourceFormat = 'pdf';
  if (name.endsWith('.docx')) sourceFormat = 'docx';

  document.getElementById('resultActions').classList.remove('d-none');
  document.getElementById('downloadPdfBtn').classList.toggle('d-none', sourceFormat !== 'pdf');
  document.getElementById('downloadDocxBtn').classList.toggle('d-none', sourceFormat !== 'docx');
}

async function exportFile(format) {
  if (!latestCleanText) return;

  const csrfToken =
    getCookie('csrftoken') ||
    document.querySelector('[name=csrfmiddlewaretoken]').value;

  const response = await fetch('/api/v1/export/', {
    method: 'POST',
    credentials: 'same-origin',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': csrfToken
    },
    body: JSON.stringify({ text: latestCleanText, format: format })
  });

  if (!response.ok) {
    const errText = await response.text();
    alert('Export failed: ' + errText.slice(0, 200));
    return;
  }

  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = format === 'pdf' ? 'scrubbed_result.pdf' : 'scrubbed_result.docx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById('copyBtn').addEventListener('click', async function () {
  if (!latestCleanText) return;
  try {
    await navigator.clipboard.writeText(latestCleanText);
    this.innerText = 'Copied!';
    setTimeout(() => { this.innerText = 'Copy text'; }, 1500);
  } catch (err) {
    alert('Could not copy text');
  }
});

document.getElementById('downloadTxtBtn').addEventListener('click', function () {
  if (!latestCleanText) return;
  const blob = new Blob([latestCleanText], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'scrubbed_result.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

document.getElementById('downloadPdfBtn').addEventListener('click', function () {
  exportFile('pdf');
});

document.getElementById('downloadDocxBtn').addEventListener('click', function () {
  exportFile('docx');
});

document.getElementById('fileUploadForm').addEventListener('submit', async function (e) {
  e.preventDefault();

  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const statusMessage = document.getElementById('statusMessage');
  const fileOutput = document.getElementById('fileOutput');
  const fileSummary = document.getElementById('fileSummary');
  const resultActions = document.getElementById('resultActions');

  if (!fileInput.files[0]) return;

  uploadBtn.disabled = true;
  loadingSpinner.classList.remove('d-none');
  fileOutput.classList.add('d-none');
  resultActions.classList.add('d-none');
  fileSummary.innerHTML = '';
  statusMessage.innerText = 'Uploading file...';

  const formData = new FormData();
  formData.append('file', fileInput.files[0]);

  const csrfToken =
    getCookie('csrftoken') ||
    document.querySelector('[name=csrfmiddlewaretoken]').value;

  try {
    const response = await fetch('/api/v1/sanitize/file/', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'X-CSRFToken': csrfToken },
      body: formData
    });

    const text = await response.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      alert('Server error ' + response.status + ':\n' + text.slice(0, 300));
      resetUI();
      return;
    }

    if (response.status === 202 && data.task_id) {
      statusMessage.innerText = 'File queued. Worker is scrubbing in the background...';
      pollTaskStatus(data.task_id);
    } else {
      alert('Upload error: ' + (data.error || data.detail || text));
      resetUI();
    }
  } catch (err) {
    alert('Server connection error: ' + err.message);
    resetUI();
  }

  function pollTaskStatus(taskId) {
    const interval = setInterval(async () => {
      try {
        const res = await fetch(`/api/v1/tasks/${taskId}/`, {
          method: 'GET',
          credentials: 'same-origin'
        });

        const text = await res.text();
        let taskData;
        try {
          taskData = JSON.parse(text);
        } catch {
          clearInterval(interval);
          alert('Status check failed ' + res.status + ':\n' + text.slice(0, 300));
          resetUI();
          return;
        }

        if (taskData.status === 'SUCCESS') {
          clearInterval(interval);

          const cleanText = taskData.result.clean_text || '(No text extracted)';
          const filename = taskData.result.filename || '';

          fileOutput.innerText = cleanText;
          fileOutput.classList.remove('d-none');

          // THIS shows the buttons
          showResultActions(taskData.result.clean_text || '', filename);

          if (taskData.result && taskData.result.summary) {
            let summaryHtml = '<h6>Detected Entities</h6><ul class="list-group">';
            for (const [entity, count] of Object.entries(taskData.result.summary)) {
              summaryHtml += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  ${entity}
                  <span class="badge bg-danger rounded-pill">${count}</span>
                </li>`;
            }
            summaryHtml += '</ul>';
            fileSummary.innerHTML = summaryHtml;
          }

          resetUI();
        } else if (taskData.status === 'FAILED') {
          clearInterval(interval);
          alert('Celery worker failed: ' + (taskData.error || 'unknown error'));
          resetUI();
        }
      } catch (err) {
        clearInterval(interval);
        alert('Failed to check task status: ' + err.message);
        resetUI();
      }
    }, 2000);
  }
});
</script>
{% endblock %}
